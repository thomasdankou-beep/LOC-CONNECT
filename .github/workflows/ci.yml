name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: locconnect
          POSTGRES_PASSWORD: locconnect
          POSTGRES_DB: locconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locconnect" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://locconnect:locconnect@localhost:5432/locconnect_test?schema=public
      DATABASE_URL_TEST: postgresql://locconnect:locconnect@localhost:5432/locconnect_test?schema=public
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0000
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-0000
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
